<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Respiratório 3D Avançado</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0d1117; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        #canvas-container { width: 100vw; height: 100vh; }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(22, 27, 34, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
            pointer-events: auto;
            max-width: 320px;
            z-index: 10;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }

        h1 { margin: 0 0 15px 0; font-size: 1.3rem; text-align: center; color: #58a6ff; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

        button {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            font-weight: 500;
        }

        button:hover { background-color: #30363d; border-color: #8b949e; color: white; }

        .structure-btn { border-left: 4px solid #2ea043; }
        .structure-btn:hover { background-color: #2ea043; color: white; border-color: #2ea043; }

        .action-btn { border-left: 4px solid #58a6ff; }
        .action-btn:hover { background-color: #58a6ff; color: white; border-color: #58a6ff; }

        #legend {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #30363d;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #8b949e;
        }

        #legend strong { color: #c9d1d9; display: block; margin-bottom: 5px; font-size: 1.05rem; }

    </style>
</head>
<body>
    <div id="ui-container">
        <h1>Sistema Respiratório</h1>

        <div class="btn-group">
            <button id="btn-rotate" class="action-btn">Pausar Rotação</button>
            <button id="btn-zoom-in" class="action-btn">Aproximar</button>
            <button id="btn-zoom-out" class="action-btn">Afastar</button>
            <button id="btn-reset" class="action-btn">Visão Geral</button>
        </div>

        <div class="btn-group">
            <button class="structure-btn" data-target="traqueia">Detalhar Traqueia</button>
            <button class="structure-btn" data-target="pulmoes">Detalhar Pulmões</button>
            <button class="structure-btn" data-target="diafragma">Detalhar Diafragma</button>
        </div>

        <div id="legend">
            <strong>Visão Geral</strong>
            O sistema respiratório é responsável pela troca de gases entre o organismo e o ambiente. Inclui as vias aéreas, pulmões e músculos respiratórios.
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2('#0d1117', 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const defaultCameraPos = new THREE.Vector3(0, 0, 14);
        camera.position.copy(defaultCameraPos);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x0d1117, 1);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 25;
        controls.minDistance = 3;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xaaccff, 0.4);
        fillLight.position.set(-5, 0, -5);
        scene.add(fillLight);

        // Group for the whole system
        const respiratorySystem = new THREE.Group();
        scene.add(respiratorySystem);

        // Materials
        const cartilageMat = new THREE.MeshStandardMaterial({
            color: '#e0d8c8',
            roughness: 0.6,
            metalness: 0.1
        });

        const lungMat = new THREE.MeshPhysicalMaterial({
            color: '#e87575',
            transparent: true,
            opacity: 0.55,
            roughness: 0.3,
            transmission: 0.2, // glass-like effect
            thickness: 0.5,
            side: THREE.DoubleSide
        });

        const muscleMat = new THREE.MeshStandardMaterial({
            color: '#b33939',
            roughness: 0.8,
            side: THREE.DoubleSide
        });

        const bodyMat = new THREE.MeshPhysicalMaterial({
            color: '#2b313d',
            transparent: true,
            opacity: 0.15,
            roughness: 0.4,
            transmission: 0.5,
            depthWrite: false
        });

        const targets = {};

        // 0. Torso Context
        const torsoGeo = new THREE.CapsuleGeometry(3.2, 4.5, 32, 32);
        const torso = new THREE.Mesh(torsoGeo, bodyMat);
        torso.position.set(0, -0.5, -0.5);
        respiratorySystem.add(torso);

        // 1. Traqueia (Trachea)
        const tracheaGroup = new THREE.Group();

        // Trachea tube
        const tracheaPath = new THREE.LineCurve3(new THREE.Vector3(0, 3.2, 0), new THREE.Vector3(0, 1.2, 0));
        const tracheaGeo = new THREE.TubeGeometry(tracheaPath, 20, 0.32, 16, false);
        const trachea = new THREE.Mesh(tracheaGeo, cartilageMat);
        trachea.castShadow = true;
        tracheaGroup.add(trachea);

        // Cartilage rings
        for(let i = 0; i < 14; i++) {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.04, 12, 24), cartilageMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 1.3 + (i * 0.14);
            tracheaGroup.add(ring);
        }
        respiratorySystem.add(tracheaGroup);
        targets.traqueia = new THREE.Vector3(0, 2.2, 0);

        // 2. Brônquios (Bronchial tree)
        function createBranch(startPoint, endPoint, radiusStart, radiusEnd) {
            const distance = startPoint.distanceTo(endPoint);
            const geo = new THREE.CylinderGeometry(radiusStart, radiusEnd, distance, 16);
            geo.translate(0, distance / 2, 0);
            geo.rotateX(Math.PI / 2);
            const mesh = new THREE.Mesh(geo, cartilageMat);
            mesh.position.copy(startPoint);
            mesh.lookAt(endPoint);
            mesh.castShadow = true;
            return mesh;
        }

        const bronchiGroup = new THREE.Group();
        // Main bronchi
        const pTracheaEnd = new THREE.Vector3(0, 1.2, 0);
        const pRightMain = new THREE.Vector3(0.8, 0.3, -0.2);
        const pLeftMain = new THREE.Vector3(-0.8, 0.4, -0.1);

        bronchiGroup.add(createBranch(pTracheaEnd, pRightMain, 0.28, 0.22));
        bronchiGroup.add(createBranch(pTracheaEnd, pLeftMain, 0.28, 0.22));

        // Secondary branches (Lobares)
        // Right side (3 lobes)
        const pRightSec1 = new THREE.Vector3(1.4, 0.8, -0.4); // Superior
        const pRightSec2 = new THREE.Vector3(1.6, -0.1, 0.1); // Middle
        const pRightSec3 = new THREE.Vector3(1.3, -1.0, -0.3); // Inferior
        bronchiGroup.add(createBranch(pRightMain, pRightSec1, 0.22, 0.12));
        bronchiGroup.add(createBranch(pRightMain, pRightSec2, 0.22, 0.12));
        bronchiGroup.add(createBranch(pRightMain, pRightSec3, 0.22, 0.12));

        // Left side (2 lobes)
        const pLeftSec1 = new THREE.Vector3(-1.4, 0.9, -0.3); // Superior
        const pLeftSec2 = new THREE.Vector3(-1.5, -0.8, -0.1); // Inferior
        bronchiGroup.add(createBranch(pLeftMain, pLeftSec1, 0.22, 0.12));
        bronchiGroup.add(createBranch(pLeftMain, pLeftSec2, 0.22, 0.12));

        respiratorySystem.add(bronchiGroup);

        // 3. Pulmões (Lungs)
        // Creating a custom shape for the lungs using LatheGeometry and deformation
        const lungPoints = [];
        for (let i = 0; i <= 24; i++) {
            const t = i / 24;
            // Tapered top, wider bottom curve
            const x = Math.sin(t * Math.PI) * (0.8 + t * 0.8);
            const y = (t * 2) - 1; // from -1 to 1
            lungPoints.push(new THREE.Vector2(x, y));
        }
        const baseLungGeo = new THREE.LatheGeometry(lungPoints, 32);

        // Right Lung
        const rightLung = new THREE.Mesh(baseLungGeo, lungMat);
        rightLung.scale.set(1.1, 1.9, 1.2);
        rightLung.position.set(1.5, -0.2, -0.1);
        respiratorySystem.add(rightLung);

        // Left Lung (with cardiac notch - simulated by scaling/rotating)
        const leftLungGeo = baseLungGeo.clone();

        // Deform left lung for cardiac notch
        const posAttribute = leftLungGeo.attributes.position;
        const v = new THREE.Vector3();
        for(let i = 0; i < posAttribute.count; i++) {
            v.fromBufferAttribute(posAttribute, i);
            // Indent the inner-lower side (x < 0, y < 0) for the heart
            if (v.x > 0 && v.y < 0) { // Remember local space coordinates
                v.x -= 0.3 * Math.abs(v.y);
            }
            posAttribute.setXYZ(i, v.x, v.y, v.z);
        }
        leftLungGeo.computeVertexNormals();

        const leftLung = new THREE.Mesh(leftLungGeo, lungMat);
        leftLung.scale.set(0.95, 1.8, 1.1);
        leftLung.position.set(-1.4, -0.1, -0.1);
        leftLung.rotation.z = -0.05;
        respiratorySystem.add(leftLung);

        targets.pulmoes = new THREE.Vector3(0, -0.1, 0);

        // 4. Diafragma (Diaphragm) - Double dome shape
        const diaphragmGeo = new THREE.SphereGeometry(2.8, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2);
        const diagPosAttribute = diaphragmGeo.attributes.position;

        for(let i = 0; i < diagPosAttribute.count; i++) {
            v.fromBufferAttribute(diagPosAttribute, i);
            // Create a dip in the center to simulate the double dome structure
            const distFromCenter = Math.abs(v.x);
            if(v.y > 0) {
                // Lower the center
                const dip = Math.exp(-Math.pow(v.x * 1.2, 2)) * 0.7;
                v.y -= dip;
            }
            diagPosAttribute.setXYZ(i, v.x, v.y, v.z);
        }
        diaphragmGeo.computeVertexNormals();

        const diaphragm = new THREE.Mesh(diaphragmGeo, muscleMat);
        diaphragm.position.set(0, -2.6, 0);
        diaphragm.scale.set(1.15, 0.45, 1);
        respiratorySystem.add(diaphragm);
        targets.diafragma = new THREE.Vector3(0, -2.6, 0);

        // Center entire model
        respiratorySystem.position.y = -0.5;

        // Interaction state
        let isAutoRotating = true;
        let targetCameraPos = defaultCameraPos.clone();
        let targetLookAt = new THREE.Vector3(0,0,0);
        let animatingCamera = false;

        // UI Logic
        const btnRotate = document.getElementById('btn-rotate');
        btnRotate.addEventListener('click', () => {
            isAutoRotating = !isAutoRotating;
            btnRotate.textContent = isAutoRotating ? "Pausar Rotação" : "Retomar Rotação";
        });

        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            camera.position.lerp(new THREE.Vector3(0,0,0), 0.2);
            animatingCamera = false;
        });

        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            camera.position.lerp(new THREE.Vector3(0,0,0), -0.25);
            animatingCamera = false;
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            animatingCamera = true;
            targetCameraPos.copy(defaultCameraPos);
            targetLookAt.set(0,0,0);
            updateLegend('geral');
        });

        const structureBtns = document.querySelectorAll('.structure-btn');
        structureBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.target.dataset.target;
                animatingCamera = true;

                const focusPoint = targets[target].clone().add(respiratorySystem.position);
                targetLookAt.copy(focusPoint);

                let offset = new THREE.Vector3(0, 0, 6);
                if (target === 'diafragma') offset = new THREE.Vector3(0, -2, 7);
                if (target === 'traqueia') offset = new THREE.Vector3(0, 0, 5);

                targetCameraPos.copy(focusPoint).add(offset);
                updateLegend(target);
            });
        });

        const legends = {
            'geral': '<strong>Visão Geral</strong> O sistema respiratório é responsável pela troca de gases entre o organismo e o ambiente. Inclui as vias aéreas, pulmões e músculos respiratórios.',
            'traqueia': '<strong>Traqueia e Brônquios</strong> A traqueia é um tubo cartilaginoso que se bifurca nos brônquios principais (direito e esquerdo), conduzindo o ar até os pulmões.',
            'pulmoes': '<strong>Pulmões</strong> Órgãos vitais da respiração. Note que o pulmão esquerdo possui uma incisura cardíaca (depressão) para acomodar o coração, sendo ligeiramente menor que o direito.',
            'diafragma': '<strong>Diafragma</strong> Músculo em forma de dupla cúpula que separa o tórax do abdômen. Sua contração é o principal motor da inspiração.'
        };

        function updateLegend(key) {
            document.getElementById('legend').innerHTML = legends[key];
        }

        // Window resize handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (isAutoRotating && !animatingCamera) {
                respiratorySystem.rotation.y += 0.003;
            }

            if (animatingCamera) {
                camera.position.lerp(targetCameraPos, 0.06);
                controls.target.lerp(targetLookAt, 0.06);

                if (camera.position.distanceTo(targetCameraPos) < 0.05 && controls.target.distanceTo(targetLookAt) < 0.05) {
                    animatingCamera = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
